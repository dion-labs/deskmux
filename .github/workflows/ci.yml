name: macOS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift test
      - run: Scripts/build-app.sh
        env:
          DESKMUX_SIGNING_IDENTITY: '-'
      - run: codesign --verify --deep --strict .build/DeskMux.app
